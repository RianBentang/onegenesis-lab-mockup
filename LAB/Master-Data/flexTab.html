<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Tab | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- Pageheader (onegenesis-web pages/Core/GEN/FlexTab) -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">Master Data</a></li>
                <li class="breadcrumb-item active" aria-current="page">Flex Tab</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0">Flex Tab</h1>
            </div>
            <div class="btn-list spk-page-header-actions-host">
              <div class="spk-page-header-actions-card">
                <a href="flexTabForm.html" class="btn btn-primary btn-sm btn-wave d-inline-flex align-items-center"><i class="ri-add-line me-1 align-middle"></i>Create FlexTab</a>
              </div>
            </div>
          </div>

          <!-- SpkTablePagination: FlexTab list -->
          <div class="card custom-card">
            <div class="card-header p-0 d-flex flex-column flex-md-row justify-content-between align-items-stretch align-items-md-center gap-2 border-bottom">
              <ul class="nav nav-tabs tab-style-2 mb-0 border-0 d-flex flex-nowrap px-3" role="tablist">
                <li class="nav-item" role="presentation">
                  <a class="nav-link active" href="#!" role="tab">
                    <i class="ri-list-settings-line me-1 align-middle"></i>FlexTab
                    <span class="badge bg-primary-transparent rounded-pill ms-1" id="countFlexTab">0</span>
                  </a>
                </li>
              </ul>
              <div class="d-flex align-items-center flex-wrap gap-2 px-3 pb-2 pb-md-0">
                <input type="text" class="form-control form-control-sm" id="tableSearch" placeholder="Search FlexTab ID, description, item..." style="width: 300px;" />
              </div>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover text-nowrap border mb-0">
                  <thead>
                    <tr>
                      <th style="width: 1%">Action</th>
                      <th>FlexTab ID</th>
                      <th>Description</th>
                      <th>Parent ID</th>
                      <th>Item</th>
                    </tr>
                  </thead>
                  <tbody id="flexTabListBody"></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Modal: delete confirmation -->
    <div class="modal fade" id="deleteFlexTabModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h6 class="modal-title fw-semibold">Delete FlexTab?</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">Do you want to delete FlexTab <b id="deleteFlexTabId"></b>?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-danger" id="btnConfirmDeleteFlexTab">Yes, Delete it!</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/spk-toast.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/spk-history.js"></script><!-- Approval / Document History + record.activity -->
    <script src="../assets/dummy-flextab.js"></script>
    <script src="../assets/flex-tab-list.js"></script>
  </body>
</html>
