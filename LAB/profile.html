<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Profile | HOLABSYS</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="icon" href="assets/og-theme/brand/favicon.ico" />
    <link href="assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="assets/lab.css" rel="stylesheet" />
  </head>
  <body>

    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- Pageheader -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Profile</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0">Profile</h1>
            </div>
          </div>

        <div class="card custom-card">
          <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-4">
              <span class="avatar avatar-xl avatar-rounded bg-primary-transparent text-primary fw-semibold fs-18" id="profileAvatar">MV</span>
              <div>
                <div class="fw-semibold fs-15" id="profileFullName">Marsya Valentina</div>
                <div class="badge bg-primary-transparent mt-1" id="profileRoleBadge">BSU &middot; Basic User</div>
              </div>
            </div>

            <form class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="profileNameInput" class="form-control" value="Marsya Valentina" />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="profileEmailInput" class="form-control" value="marsya.valentina@garudafood.com" />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Departemen</label>
                <input type="text" id="profileDeptInput" class="form-control" value="Quality Assurance" />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Perusahaan</label>
                <input type="text" id="profileCompanyInput" class="form-control" value="PT Garudafood Putra Putri Jaya Tbk" disabled />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Role</label>
                <input type="text" id="profileRoleInput" class="form-control" value="BSU - Basic User" disabled />
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-sm btn-primary btn-wave">Simpan Perubahan</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/og-shell.js"></script>
  </body>
</html>
