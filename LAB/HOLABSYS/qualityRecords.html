<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quality Records | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- Pageheader -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">Quality Records</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0">Quality Records</h1>
            </div>
            <div class="btn-list spk-page-header-actions-host">
              <div class="spk-page-header-actions-card" id="qrHeaderActions"></div>
            </div>
          </div>

          <!-- SpkCountercard row -->
          <div class="row g-3 mb-3" id="qrCounters"></div>

          <!-- SpkTablePagination: one card, tabs per record kind -->
          <div class="card custom-card">
            <div class="card-header p-0 d-flex flex-column flex-md-row justify-content-between align-items-stretch align-items-md-center gap-2 border-bottom">
              <ul class="nav nav-tabs tab-style-2 mb-0 border-0 d-flex flex-nowrap px-3" role="tablist" id="qrTabs">
                <li class="nav-item" role="presentation">
                  <a class="nav-link active" href="#!" role="tab" data-tab="Nonconforming Work"><i class="ri-error-warning-line me-1 align-middle"></i>Nonconforming Work &amp; CAPA
                    <span class="badge bg-primary-transparent rounded-pill ms-1" data-count="Nonconforming Work">0</span></a>
                </li>
                <li class="nav-item" role="presentation">
                  <a class="nav-link" href="#!" role="tab" data-tab="Complaint"><i class="ri-feedback-line me-1 align-middle"></i>Complaints
                    <span class="badge bg-primary-transparent rounded-pill ms-1" data-count="Complaint">0</span></a>
                </li>
                <li class="nav-item" role="presentation">
                  <a class="nav-link" href="#!" role="tab" data-tab="PT"><i class="ri-medal-line me-1 align-middle"></i>Proficiency Testing
                    <span class="badge bg-primary-transparent rounded-pill ms-1" data-count="PT">0</span></a>
                </li>
              </ul>
              <div class="d-flex align-items-center flex-wrap gap-2 px-3 pb-2 pb-md-0">
                <!-- SpkSelect2 -->
                <div style="width: 160px;" id="qrStatusWrap">
                  <select id="qrFilterStatus" class="form-select form-select-sm">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                  </select>
                </div>
                <input type="text" class="form-control form-control-sm" id="qrSearch" placeholder="Search no., request, parameter..." style="width: 260px;" />
              </div>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover border mb-0 align-middle">
                  <thead id="qrHead"></thead>
                  <tbody id="qrBody"></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Modal: Nonconforming Work / Complaint -->
    <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h6 class="modal-title fw-semibold" id="qrModalTitle">Quality Record</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="qrForm" class="row gy-3" novalidate>
              <div class="col-md-4">
                <label class="form-label" for="qrType">Type <span class="text-danger">*</span></label>
                <select id="qrType" class="form-select" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="qrRequest">Request No.</label>
                <input type="text" id="qrRequest" class="form-control font-monospace" placeholder="REQ-yyyymm-NNNN" />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="qrOwner">Owner <span class="text-danger">*</span></label>
                <input type="text" id="qrOwner" class="form-control" required />
              </div>
              <div class="col-12">
                <label class="form-label" for="qrParams">Parameter(s)</label>
                <input type="text" id="qrParams" class="form-control" />
              </div>
              <div class="col-12">
                <label class="form-label" for="qrDescription">Description <span class="text-danger">*</span></label>
                <textarea id="qrDescription" class="form-control" rows="2" required></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="qrRootCause">Root Cause</label>
                <textarea id="qrRootCause" class="form-control" rows="2" placeholder="Required to close"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="qrAction">Correction / Corrective Action</label>
                <textarea id="qrAction" class="form-control" rows="2" placeholder="Required to close"></textarea>
              </div>
              <div class="col-12 fs-12 text-muted" id="qrMeta"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-success d-inline-flex align-items-center gap-1" id="btnCloseQr"><i class="ri-lock-line"></i> Save &amp; Close Record</button>
            <button type="button" class="btn btn-sm btn-primary d-inline-flex align-items-center gap-1" id="btnSaveQr"><i class="ri-save-line"></i> Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Proficiency Testing result -->
    <div class="modal fade" id="ptModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h6 class="modal-title fw-semibold">Add Proficiency Testing Result</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="ptForm" class="row gy-3" novalidate>
              <div class="col-12">
                <label class="form-label" for="ptScheme">Scheme <span class="text-danger">*</span></label>
                <input type="text" id="ptScheme" class="form-control" required placeholder="FAPAS 1427 — Proximates in Biscuit" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="ptProvider">Provider <span class="text-danger">*</span></label>
                <input type="text" id="ptProvider" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="ptParameter">Parameter <span class="text-danger">*</span></label>
                <select id="ptParameter" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="ptRound">Round <span class="text-danger">*</span></label>
                <input type="text" id="ptRound" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="ptDate">Report Date <span class="text-danger">*</span></label>
                <input type="text" id="ptDate" class="form-control" required placeholder="dd-mm-yyyy" />
              </div>
              <div class="col-4">
                <label class="form-label" for="ptAssigned">Assigned Value <span class="text-danger">*</span></label>
                <input type="number" step="any" id="ptAssigned" class="form-control" required />
              </div>
              <div class="col-4">
                <label class="form-label" for="ptResult">Lab Result <span class="text-danger">*</span></label>
                <input type="number" step="any" id="ptResult" class="form-control" required />
              </div>
              <div class="col-4">
                <label class="form-label" for="ptSdpa">σ<sub>pt</sub> <span class="text-danger">*</span></label>
                <input type="number" step="any" id="ptSdpa" class="form-control" required />
              </div>
              <div class="col-12 fs-12" id="ptPreview"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" id="btnSavePt"><i class="ri-save-line me-1"></i>Save</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/spk-toast.js"></script>
    <script src="../assets/spk-kit.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/spk-history.js"></script><!-- Approval / Document History + record.activity -->
    <script src="../assets/dummy-parameters.js"></script>
    <script src="../assets/dummy-requests.js"></script>
    <script src="../assets/dummy-quality.js"></script>
    <script src="../assets/quality-records.js"></script>
  </body>
</html>
