<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- Pageheader -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">Internal</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0">Internal</h1>
            </div>
            <div class="btn-list spk-page-header-actions-host">
              <div class="spk-page-header-actions-card" id="listActionButtons"></div>
            </div>
          </div>

          <!-- SpkTablePagination -->
          <div class="card custom-card">
            <div class="card-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
              <div class="card-title">Request List <span class="badge bg-primary-transparent rounded-pill ms-1" id="countRequest">0</span></div>
              <div class="d-flex align-items-center flex-wrap gap-2">
                <!-- SpkSelect2 -->
                <div style="width: 190px;">
                  <select id="filterStatus" class="form-select form-select-sm">
                    <option value="">Semua Status</option>
                    <option value="Draft">Draft</option>
                    <option value="Confirm to Approve">Confirm to Approve</option>
                    <option value="Partially Approved">Partially Approved</option>
                    <option value="Fully Approved">Fully Approved</option>
                    <option value="Return to Edit">Return to Edit</option>
                    <option value="Rejected">Rejected</option>
                  </select>
                </div>
                <input type="text" class="form-control form-control-sm" id="tableSearch" placeholder="Cari No. ID Transaksi, sampel, tujuan, No. SPK..." style="width: 300px;" />
              </div>
            </div>
            <div class="card-body pt-0">
              <div class="table-responsive">
                <table class="table table-hover text-nowrap border mt-3 mb-0">
                  <thead>
                    <tr>
                      <th style="width: 1%">Aksi</th>
                      <th>No. ID Transaksi</th>
                      <th>Tanggal</th>
                      <th>Sampel</th>
                      <th>Tipe</th>
                      <th>Tujuan Analisa</th>
                      <th>No. SPK</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="requestListBody"></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/dummy-requests.js"></script>
    <script src="../assets/internal-list.js"></script>
  </body>
</html>
