<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Report Form | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>

    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

        <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2 no-print">
          <div>
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item"><a href="#!">Report</a></li>
                <li class="breadcrumb-item active" aria-current="page">Draft &amp; Final Report</li>
              </ol>
            <h1 class="page-title fw-medium fs-18 mb-0">Draft &amp; Final Report</h1>
          </div>
          <div id="formActionButtons" class="d-flex flex-wrap gap-2">
            <a href="reportList.html" class="btn btn-sm bg-white d-inline-flex align-items-center gap-1">
              <i class="ri-arrow-left-line"></i> Back
            </a>
          </div>
        </div>

        <div class="card custom-card no-print">
          <div class="card custom-card d-flex flex-row align-items-center justify-content-between flex-wrap gap-2 p-2 mb-3">
            <div class="d-flex align-items-center flex-wrap gap-2">
              <div class="d-flex flex-column gap-1 lh-1">
                <span class="text-uppercase text-muted fs-10">No. ID Pengajuan</span>
                <span class="fs-13 text-heading text-nowrap font-monospace" id="docNoValue">REQ-202609-XXXX</span>
              </div>
              <span class="d-none d-sm-inline-block text-muted opacity-50 fs-10 user-select-none lh-1">|</span>
              <div class="d-flex flex-column gap-1 lh-1">
                <span class="text-uppercase text-muted fs-10">No. LHU/COA</span>
                <span class="fs-13 text-heading text-nowrap font-monospace" id="reportNoValue">Belum Terbit</span>
              </div>
              <span class="d-none d-sm-inline-block text-muted opacity-50 fs-10 user-select-none lh-1">|</span>
              <div class="d-flex flex-column gap-1 lh-1">
                <span class="text-uppercase text-muted fs-10">Status</span>
                <span id="reportStatusBadge" class="badge bg-warning-transparent">Draft</span>
              </div>
            </div>
          </div>
        </div>

        <div id="reportContent"></div>

      </div>
      </div>
    </div>

    <div id="appToastContainer" class="no-print"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/dummy-requests.js"></script>
    <script src="../assets/dummy-external-requests.js"></script>
    <script src="../assets/report-form.js"></script>
  </body>
</html>
