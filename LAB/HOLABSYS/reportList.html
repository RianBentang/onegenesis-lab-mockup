<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Report | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>

    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

        <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
          <div>
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">Report</li>
              </ol>
            <h1 class="page-title fw-medium fs-18 mb-0">Report</h1>
          </div>
        </div>

          <!-- SpkTablePagination -->
          <div class="card custom-card">
            <div class="card-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
              <div>
                <div class="card-title">Draft &amp; Final Report <span class="badge bg-primary-transparent rounded-pill ms-1" id="countReport">0</span></div>
                <p class="text-muted fs-12 mb-0 mt-1">Internal, Sensory &amp; ASLT masuk setelah Push Data dari Excel; External dari COA vendor.</p>
              </div>
              <div class="d-flex align-items-center flex-wrap gap-2">
                <div style="width: 170px;">
                  <select id="filterJenis" class="form-select form-select-sm">
                    <option value="">Semua Jenis Lab</option>
                    <option value="internal">Internal</option>
                    <option value="sensory">Sensory</option>
                    <option value="aslt">ASLT</option>
                    <option value="external">External</option>
                  </select>
                </div>
                <div style="width: 160px;">
                  <select id="filterStatus" class="form-select form-select-sm">
                    <option value="">Semua Status</option>
                    <option value="Draft">Draft</option>
                    <option value="Final">Final</option>
                  </select>
                </div>
                <input type="text" class="form-control form-control-sm" id="tableSearch" placeholder="Cari No. ID Transaksi, sampel, No. LHU/COA..." style="width: 300px;" />
              </div>
            </div>
            <div class="card-body pt-0">
              <div class="table-responsive">
                <table class="table table-hover text-nowrap border mt-3 mb-0">
                  <thead>
                    <tr>
                      <th style="width: 1%">Aksi</th>
                      <th>No. ID Transaksi</th>
                      <th>Jenis Lab</th>
                      <th>Sampel</th>
                      <th>No. LHU/COA</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="reportListBody"></tbody>
                </table>
              </div>
            </div>
          </div>

      </div>
      </div>
    </div>

    <div id="appToastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/dummy-requests.js"></script>
    <script src="../assets/dummy-external-requests.js"></script>
    <script src="../assets/dummy-aslt-sensory-requests.js"></script>
    <script src="../assets/dummy-worksheet.js"></script>
    <script src="../assets/report-list.js"></script>
  </body>
</html>
