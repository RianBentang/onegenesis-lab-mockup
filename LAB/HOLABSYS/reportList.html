<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Report | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>

    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

        <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
          <div>
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">Report</li>
              </ol>
            <h1 class="page-title fw-medium fs-18 mb-0">Report</h1>
          </div>
        </div>

        <!-- Nav tabs (react-bootstrap Nav, nav-tabs tab-style-2) -->
          <div class="card custom-card mb-3 overflow-hidden">
            <div class="card-body p-0">
              <div class="border-bottom">
                <ul class="nav nav-tabs tab-style-2 mb-0 d-flex flex-nowrap" role="tablist" data-tabgroup="report">
                  <li class="nav-item" role="presentation">
                    <a class="nav-link active" href="#!" role="tab" data-tab="pushdata">
                      <i class="ri-upload-2-line me-1 align-middle"></i>Push Data
                      <span class="badge bg-primary-transparent rounded-pill ms-1" id="countPushData">0</span>
                    </a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a class="nav-link" href="#!" role="tab" data-tab="draftreport">
                      <i class="ri-file-text-line me-1 align-middle"></i>Draft &amp; Final Report
                      <span class="badge bg-primary-transparent rounded-pill ms-1" id="countDraftReport">0</span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <!-- SpkTablePagination -->
          <div class="card custom-card">
            <div class="card-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
              <div class="card-title" id="listTitle">Push Data</div>
              <div class="position-relative w-100" style="max-width: 400px">
                <input type="text" class="form-control form-control-sm w-100" id="tableSearch" placeholder="Cari..." />
              </div>
            </div>

          <div class="card-body pt-0" id="pane-pushdata" data-pane="pushdata">
            <div class="table-responsive">
              <table class="table table-hover text-nowrap border mt-3 mb-0">
                <thead>
                  <tr>
                    <th>No. Pengajuan</th>
                    <th>Sampel</th>
                    <th>Laboratorium</th>
                    <th>Tanggal</th>
                    <th class="text-end">Aksi</th>
                  </tr>
                </thead>
                <tbody id="pushDataListBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card-body pt-0 d-none" id="pane-draftreport" data-pane="draftreport">
            <div class="table-responsive">
              <table class="table table-hover text-nowrap border mt-3 mb-0">
                <thead>
                  <tr>
                    <th style="width: 1%">Aksi</th>
                    <th>No. Pengajuan</th>
                    <th>Jenis Lab</th>
                    <th>Sampel</th>
                    <th>No. LHU/COA</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="draftReportListBody"></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
      </div>
    </div>

    <div id="appToastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/dummy-requests.js"></script>
    <script src="../assets/dummy-external-requests.js"></script>
    <script src="../assets/report-list.js"></script>
  </body>
</html>
