<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>External | HOLABSYS</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>

    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

        <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
          <div>
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">External</li>
              </ol>
            <h1 class="page-title fw-medium fs-18 mb-0">External</h1>
          </div>
          <div id="listActionButtons" class="d-flex flex-wrap gap-2"></div>
        </div>

        <!-- Nav tabs (react-bootstrap Nav, nav-tabs tab-style-2) -->
          <div class="card custom-card mb-3 overflow-hidden">
            <div class="card-body p-0">
              <div class="border-bottom">
                <ul class="nav nav-tabs tab-style-2 mb-0 d-flex flex-nowrap" role="tablist" data-tabgroup="external">
                  <li class="nav-item" role="presentation">
                    <a class="nav-link active" href="#!" role="tab" data-tab="request">
                      <i class="ri-file-list-3-line me-1 align-middle"></i>Request List
                      <span class="badge bg-primary-transparent rounded-pill ms-1" id="countRequest">0</span>
                    </a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a class="nav-link" href="#!" role="tab" data-tab="shipment">
                      <i class="ri-truck-line me-1 align-middle"></i>Pengiriman Sampel
                      <span class="badge bg-primary-transparent rounded-pill ms-1" id="countShipment">0</span>
                    </a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a class="nav-link" href="#!" role="tab" data-tab="orderconf">
                      <i class="ri-file-list-2-line me-1 align-middle"></i>Order Confirmation
                      <span class="badge bg-primary-transparent rounded-pill ms-1" id="countOrderConf">0</span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <!-- SpkTablePagination -->
          <div class="card custom-card">
            <div class="card-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
              <div class="card-title" id="listTitle">Request List</div>
              <div class="position-relative w-100" style="max-width: 400px">
                <input type="text" class="form-control form-control-sm w-100" id="tableSearch" placeholder="Cari..." />
              </div>
            </div>

          <div class="card-body pt-0" id="pane-request" data-pane="request">
            <div class="table-responsive">
              <table class="table table-hover text-nowrap border mt-3 mb-0">
                <thead>
                  <tr>
                    <th style="width: 1%">Aksi</th>
                    <th>No. Pengajuan</th>
                    <th>Tanggal</th>
                    <th>Sampel</th>
                    <th>Tipe</th>
                    <th>Tujuan Analisa</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="requestListBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card-body pt-0 d-none" id="pane-shipment" data-pane="shipment">
            <div class="table-responsive">
              <table class="table table-hover text-nowrap border mt-3 mb-0">
                <thead>
                  <tr>
                    <th>No. Pengajuan</th>
                    <th>Sampel</th>
                    <th>Laboratorium Tujuan</th>
                    <th>Tanggal Pengajuan</th>
                  </tr>
                </thead>
                <tbody id="shipmentListBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card-body pt-0 d-none" id="pane-orderconf" data-pane="orderconf">
            <div class="table-responsive">
              <table class="table table-hover text-nowrap border mt-3 mb-0">
                <thead>
                  <tr>
                    <th>No. Pengajuan</th>
                    <th>Sampel</th>
                    <th>Laboratorium Tujuan</th>
                    <th>Tanggal Pengajuan</th>
                  </tr>
                </thead>
                <tbody id="orderConfListBody"></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/dummy-external-requests.js"></script>
    <script src="../assets/external-list.js"></script>
  </body>
</html>
