<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feature Form | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="../assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- SpkForm: Pageheader with action buttons (buttonsInHeader) -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">Create Feature</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0">Feature</h1>
            </div>
            <div class="btn-list spk-page-header-actions-host">
              <div class="spk-page-header-actions-card">
                <div class="d-flex flex-wrap gap-2 justify-content-start justify-content-sm-end w-100 w-sm-auto">
                  <a href="featureList.html" class="btn btn-light btn-sm btn-wave d-inline-flex align-items-center"><i class="ri-arrow-left-line me-1"></i><span>Back</span></a>
                  <button type="button" class="btn btn-primary btn-sm btn-wave d-inline-flex align-items-center" id="btnSave"><i class="ri-save-line me-1"></i><span>Save</span></button>
                  <button type="button" class="btn btn-success btn-sm btn-wave d-inline-flex align-items-center" id="btnSubmit"><i class="ri-send-plane-line me-1"></i><span>Submit</span></button>
                </div>
              </div>
            </div>
          </div>

          <!-- SpkForm: document status card -->
          <div class="card custom-card d-flex flex-row align-items-center justify-content-between flex-wrap gap-2 p-2 mb-3">
            <div class="d-flex align-items-center flex-wrap gap-2">
              <span class="badge bg-secondary-transparent d-inline-flex align-items-center gap-1 py-2 px-3 fs-11 lh-1 rounded-1">
                <i class="ri-draft-line fs-13"></i>Draft
              </span>
              <span class="d-none d-sm-inline-block text-muted opacity-50 fs-10 user-select-none lh-1">|</span>
              <span class="d-flex flex-column gap-1 lh-1">
                <span class="text-uppercase text-muted fs-10">Document No.</span>
                <span class="fs-13 text-heading text-nowrap">DOC-0001</span>
              </span>
              <span class="d-none d-sm-inline-block text-muted opacity-50 fs-10 user-select-none lh-1">|</span>
              <span class="d-flex flex-column gap-1 lh-1">
                <span class="text-uppercase text-muted fs-10">Document Date</span>
                <span class="fs-13 text-heading text-nowrap">18 Sep 2026</span>
              </span>
            </div>
            <div class="d-flex align-items-center gap-2 flex-shrink-0 flex-wrap justify-content-end">
              <button type="button" class="btn btn-sm btn-light text-muted fw-semibold d-inline-flex align-items-center gap-1"><i class="ri-shield-check-line"></i>Approval</button>
              <button type="button" class="btn btn-sm btn-light text-muted fw-semibold d-inline-flex align-items-center gap-1"><i class="ri-history-line"></i><span class="d-none d-sm-inline">Document</span> History</button>
            </div>
          </div>

          <!-- SpkFormSection: General Information -->
          <div class="card custom-card">
            <div class="card-body">
              <div class="mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                  <h6 class="fw-semibold mb-0">General Information</h6>
                  <p class="text-muted fs-12 mb-0 mt-1">Basic data for this document.</p>
                </div>
              </div>
              <div class="row gy-3">
                <div class="col-md-6">
                  <label class="form-label" for="fName">Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="fName" />
                  <div class="invalid-feedback">Name is required.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="fType">Type</label>
                  <select class="form-select" id="fType">
                    <option>Normal</option>
                    <option>Urgent</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <!-- SpkDatepicker -->
                  <label class="form-label" for="fDate">Target Date</label>
                  <div class="input-group">
                    <span class="input-group-text text-muted"><i class="ri-calendar-line"></i></span>
                    <input type="date" class="form-control" id="fDate" />
                  </div>
                </div>
                <div class="col-md-6">
                  <!-- SpkLovInput -->
                  <label class="form-label" for="fMaterial">Material</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="fMaterial" placeholder="Material code" />
                    <button type="button" class="btn btn-outline-secondary"><i class="ri-search-line"></i></button>
                  </div>
                  <input type="text" class="form-control mt-1" placeholder="Material name" readonly disabled />
                </div>
                <div class="col-12">
                  <label class="form-label" for="fRemarks">Remarks</label>
                  <textarea class="form-control" id="fRemarks" rows="3"></textarea>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/og-shell.js"></script>
    <!-- <script src="../assets/feature-form.js"></script> -->
  </body>
</html>
