<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/version-v1.js"></script><!-- proposal v1: own browser data + label -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortune-sheet/react@1.0.4/dist/index.umd.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../../../../LAB/assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- Pageheader -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">HOLABSYS</a></li>
                <li class="breadcrumb-item active" aria-current="page">Excel</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0">Worksheet</h1>
            </div>
          </div>

          <!-- FortuneSheet (port: @fortune-sheet/react <Workbook />) -->
          <div class="card custom-card sheet-card" id="sheetCard">
            <!-- Nav tabs (nav-tabs tab-style-2): Internal (per-parameter sheets) | Sensory & ASLT (per transaction) -->
            <div class="card-header p-0 d-flex flex-column flex-md-row justify-content-between align-items-stretch align-items-md-center gap-2 border-bottom">
              <ul class="nav nav-tabs tab-style-2 mb-0 border-0 d-flex flex-nowrap px-3" role="tablist" id="excelTabs">
                <li class="nav-item" role="presentation">
                  <a class="nav-link active" href="#!" role="tab" data-tab="internal"><i class="ri-flask-line me-1 align-middle"></i>Internal</a>
                </li>
                <li class="nav-item" role="presentation">
                  <a class="nav-link" href="#!" role="tab" data-tab="panel"><i class="ri-goblet-line me-1 align-middle"></i>Sensory &amp; ASLT</a>
                </li>
              </ul>
              <div class="d-flex align-items-center flex-wrap gap-2 px-3 pb-2 pb-md-0">
                <!-- SpkSelect2 -->
                <div style="width: 340px;" id="trxWrap" class="d-none">
                  <select id="trxSelect" class="form-select form-select-sm">
                    <option value="">Select Transaction ID</option>
                  </select>
                </div>
                <button type="button" id="btnPull" class="btn btn-primary btn-sm btn-wave" disabled>
                  <i class="ri-download-2-line me-1 align-middle"></i>Pull Data
                </button>
                <button type="button" id="btnPush" class="btn btn-success btn-sm btn-wave" disabled>
                  <i class="ri-upload-2-line me-1 align-middle"></i>Push Data
                </button>
                <button type="button" id="btnFullscreen" class="btn btn-primary-light btn-sm btn-wave d-inline-flex align-items-center">
                  <i class="ri-fullscreen-line me-1"></i><span>Fullscreen</span>
                </button>
              </div>
            </div>
            <p class="text-muted fs-12 mb-0 px-3 py-2" id="sheetInfo"></p>
            <div class="card-body p-0">
              <div id="sheet" class="sheet-host"></div>
            </div>
          </div>

        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortune-sheet/react@1.0.4/dist/index.umd.min.js"></script>
    <script src="../assets/spk-toast.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/spk-history.js"></script><!-- Approval / Document History + record.activity -->
    <script src="../assets/dummy-parameters.js"></script>
    <script src="../assets/dummy-requests.js"></script>
    <script src="../assets/dummy-aslt-sensory-requests.js"></script>
    <script src="../assets/dummy-schedule.js"></script>
    <script src="../assets/dummy-panel.js"></script>
    <script src="../assets/dummy-worksheet.js"></script>
    <script src="../assets/excel.js"></script>
  </body>
</html>
