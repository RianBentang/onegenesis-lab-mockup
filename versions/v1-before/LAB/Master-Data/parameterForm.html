<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/version-v1.js"></script><!-- proposal v1: own browser data + label -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Parameter Form | HOLABSYS</title>
    <link rel="icon" href="../assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../../../../LAB/assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../assets/lab.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <div class="main-content app-content">
        <div class="container-fluid">

          <!-- SpkForm: Pageheader with action buttons (buttonsInHeader) -->
          <div class="d-flex align-items-center justify-content-between page-header-breadcrumb flex-wrap gap-2">
            <div>
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#!">Master Data</a></li>
                <li class="breadcrumb-item"><a href="parameter.html">Test Parameters</a></li>
                <li class="breadcrumb-item active" aria-current="page">Parameter Form</li>
              </ol>
              <h1 class="page-title fw-medium fs-18 mb-0" id="paramPageTitle">Add Parameter</h1>
            </div>
            <div class="btn-list spk-page-header-actions-host">
              <div class="spk-page-header-actions-card">
                <div class="d-flex flex-wrap gap-2 justify-content-start justify-content-sm-end w-100 w-sm-auto">
                  <a href="parameter.html" id="btnBackParam" class="btn btn-light btn-sm btn-wave d-inline-flex align-items-center"><i class="ri-arrow-go-back-line me-1"></i><span>Back</span></a>
                  <button type="button" class="btn btn-success btn-sm btn-wave d-inline-flex align-items-center" id="btnSaveParam"><i class="ri-save-2-line me-1"></i><span>Save</span></button>
                </div>
              </div>
            </div>
          </div>

          <form id="paramForm" novalidate>
            <!-- SpkFormSection: Identitas Parameter -->
            <div class="card custom-card">
              <div class="card-body">
                <h6 class="fw-semibold mb-3">1. Parameter Identity</h6>
                <div class="row gy-3">
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="paramJenis">Type <span class="text-danger">*</span></label>
                    <select id="paramJenis" class="form-select" required>
                      <option value="Internal">Internal (tested in-house)</option>
                      <option value="External">External (sent to a vendor lab)</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-4" id="paramLabWrap">
                    <label class="form-label" for="paramLab">Laboratory <span class="text-danger">*</span></label>
                    <select id="paramLab" class="form-select"></select>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="paramCode">Parameter Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control font-monospace" id="paramCode" placeholder="PARAM-FK-07" required />
                  </div>
                  <div class="col-12 col-md-8">
                    <label class="form-label" for="paramText">Test Parameter Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="paramText" placeholder="Example: Fat Content" required />
                  </div>
                  <div class="col-12 col-md-4" id="paramLabelWrap">
                    <label class="form-label" for="paramLabel">Sample Label Code</label>
                    <input type="text" class="form-control font-monospace" id="paramLabel" maxlength="4" placeholder="FAT" />
                    <div class="form-text fs-11">Abbreviation on the sample label (max. 4 letters)</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- SpkFormSection: Metode & Scope -->
            <div class="card custom-card">
              <div class="card-body">
                <h6 class="fw-semibold mb-3">2. Method, Scope &amp; Specification</h6>
                <div class="row gy-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="paramMethod">Reference Method (SNI / AOAC / ISO / IK) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control font-monospace" id="paramMethod" placeholder="SNI 2897:2008" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="paramScope">ISO/IEC 17025 Scope Status <span class="text-danger">*</span></label>
                    <select id="paramScope" class="form-select" required>
                      <option value="true">In-Scope (Accredited)</option>
                      <option value="false">Non-Scope (Internal / non-accredited method)</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-3">
                    <label class="form-label" for="paramLeadTime">Lead Time (Days) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="paramLeadTime" min="1" max="90" value="2" required />
                  </div>
                  <div class="col-12 col-md-3">
                    <label class="form-label" for="paramSuhu">Sample Storage Temp. <span class="text-danger">*</span></label>
                    <select id="paramSuhu" class="form-select" required></select>
                  </div>
                  <div class="col-12 col-md-3">
                    <label class="form-label" for="paramUnit">Result Unit</label>
                    <input type="text" class="form-control" id="paramUnit" placeholder="% b/b, CFU/g, mg/kg" />
                  </div>
                  <div class="col-12 col-md-3">
                    <label class="form-label" for="paramSpec">Specification / Quality Standard</label>
                    <input type="text" class="form-control" id="paramSpec" placeholder="Max. 3.0 %" />
                  </div>
                </div>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/spk-toast.js"></script>
    <script src="../assets/og-shell.js"></script>
    <script src="../assets/spk-history.js"></script><!-- Approval / Document History + record.activity -->
    <script src="../assets/dummy-flextab.js"></script>
    <script src="../assets/dummy-parameters.js"></script>
    <script src="../assets/parameter-form.js"></script>
  </body>
</html>
