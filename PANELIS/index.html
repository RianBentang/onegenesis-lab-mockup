<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Panelis | HOLABSYS</title>
    <link rel="icon" href="../LAB/assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../LAB/assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../LAB/assets/lab.css" rel="stylesheet" />
  </head>
  <body class="authentication-background">

    <!-- Sign-in (Xintra authentication-basic) -->
    <div class="container">
      <div class="row justify-content-center align-items-center authentication authentication-basic h-100">
        <div class="col-xxl-4 col-xl-5 col-lg-6 col-md-7 col-sm-9 col-12">
          <div class="card custom-card my-4">
            <div class="card-body p-5">
              <div class="mb-3 d-flex justify-content-center">
                <img src="../LAB/assets/og-theme/brand/toggle-logo.png" alt="logo" class="panelis-logo" />
              </div>
              <p class="h5 mb-1 text-center">Login Panelis</p>
              <p class="mb-4 text-muted fw-normal text-center">Sensory Booth &middot; HOLABSYS</p>

              <form id="loginForm" novalidate>
                <div class="row gy-3">
                  <div class="col-12">
                    <label class="form-label text-default" for="loginNik">NIK</label>
                    <input type="text" class="form-control" id="loginNik" placeholder="Nomor Induk Karyawan" inputmode="numeric" maxlength="12" autocomplete="username" required />
                    <div class="invalid-feedback" id="loginNikFeedback"></div>
                    <div class="form-text d-none" id="loginNikChecking"><span class="spinner-border spinner-border-sm me-1 align-middle"></span>Mencari di HRIS…</div>
                  </div>
                  <!-- HRIS lookup result: shown once the NIK is found -->
                  <div class="col-12 d-none" id="hrisResult">
                    <div class="d-flex align-items-center gap-3 border rounded-1 p-3 bg-light">
                      <span class="avatar avatar-md avatar-rounded bg-primary-transparent fw-semibold" id="hrisAvatar">AP</span>
                      <div class="flex-fill min-w-0">
                        <div class="fw-semibold text-truncate" id="hrisName">-</div>
                        <div class="fs-12 text-primary" id="hrisUsername">-</div>
                        <div class="fs-11 text-muted text-truncate" id="hrisDept">-</div>
                      </div>
                      <span class="badge bg-success-transparent" id="hrisBadge"><i class="ri-checkbox-circle-line me-1"></i>HRIS</span>
                    </div>
                  </div>
                  <div class="col-12">
                    <label class="form-label text-default" for="loginBooth">Nomor Booth</label>
                    <!-- SpkSelect2 -->
                    <select id="loginBooth" class="form-select">
                      <option value="">Sesuai jadwal panelis</option>
                      <option value="1">Booth 01</option>
                      <option value="2">Booth 02</option>
                      <option value="3">Booth 03</option>
                      <option value="4">Booth 04</option>
                      <option value="5">Booth 05</option>
                      <option value="6">Booth 06</option>
                    </select>
                  </div>
                </div>
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary btn-wave" id="loginSubmit" disabled><i class="ri-login-box-line me-1 align-middle"></i>Masuk ke Booth</button>
                </div>
              </form>

              <div class="alert alert-primary-transparent mt-4 mb-0 py-2 fs-12">
                <i class="ri-information-line me-1"></i>NIK demo: <span class="fw-semibold">20180123</span> (panelis), <span class="fw-semibold">20140219</span> (karyawan, bukan panelis). NIK lain = tidak ada di HRIS.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="appToastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../LAB/assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../LAB/assets/dummy-aslt-sensory-requests.js"></script>
    <script src="../LAB/assets/dummy-hris.js"></script>
    <script src="../LAB/assets/dummy-panel.js"></script>
    <script src="assets/panelis.js"></script>
    <script src="assets/login.js"></script>
  </body>
</html>
