<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booth Panelis | HOLABSYS</title>
    <link rel="icon" href="../LAB/assets/og-theme/brand/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="../LAB/assets/og-theme/onegenesis.css" rel="stylesheet" />
    <link href="../LAB/assets/lab.css" rel="stylesheet" />
  </head>
  <body>

    <!-- Booth top bar (no LAB sidebar: panelists only see their booth) -->
    <div class="booth-topbar border-bottom">
      <div class="container-lg d-flex align-items-center justify-content-between gap-2 py-2">
        <div class="d-flex align-items-center gap-2">
          <img src="../LAB/assets/og-theme/brand/toggle-logo.png" alt="logo" class="panelis-logo-sm" />
          <div>
            <div class="fw-semibold" id="boothNo">Sensory Booth</div>
            <div class="text-muted fs-12">HOLABSYS &middot; Panel Sensori</div>
          </div>
          <span class="badge bg-success-transparent ms-1"><i class="ri-wifi-line me-1"></i>Online</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="text-end d-none d-sm-block">
            <div class="fw-semibold fs-13" id="panelistName">-</div>
            <div class="text-muted fs-11" id="panelistMeta">-</div>
          </div>
          <button type="button" class="btn btn-icon btn-sm btn-light" id="btnTheme" title="Mode gelap / terang"><i class="ri-moon-line"></i></button>
          <button type="button" class="btn btn-sm btn-danger-light btn-wave" id="btnLogout"><i class="ri-logout-box-r-line me-1 align-middle"></i>Keluar</button>
        </div>
      </div>
    </div>

    <div class="container-lg py-4">
      <!-- Session picker, shown when more than one session is open for this panelist -->
      <div class="card custom-card d-none" id="sessionPickerCard">
        <div class="card-body d-flex align-items-center flex-wrap gap-2">
          <span class="fw-semibold me-1"><i class="ri-list-check-2 me-1 text-primary"></i>Sesi tersedia</span>
          <div style="width: 420px; max-width: 100%;">
            <!-- SpkSelect2 -->
            <select id="sessionSelect" class="form-select"></select>
          </div>
        </div>
      </div>

      <div id="boothContent"></div>
    </div>

    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="appToastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../LAB/assets/spk-select2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../LAB/assets/dummy-aslt-sensory-requests.js"></script>
    <script src="../LAB/assets/dummy-schedule.js"></script>
    <script src="../LAB/assets/dummy-panel.js"></script>
    <script src="assets/panelis.js"></script>
    <script src="assets/booth.js"></script>
  </body>
</html>
