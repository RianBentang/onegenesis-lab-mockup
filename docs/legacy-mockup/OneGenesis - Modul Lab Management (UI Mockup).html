<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneGenesis — Modul Lab Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OneGenesis — Modul Lab Management / Holabsys (UI Mockup)
   Sumber: Flow Process & Blue Print New Holabsys.xlsx,
           Catatan Meeting Lab 27 Agt 2026, OneNote "MoM Lab"
   Pola UI mengikuti skill onegenesis-mockup-ui (onegenesis-web SCSS)
   ============================================================ */
:root{
  --primary-rgb:92,103,247;
  --primary:#5C67F7; --secondary:#9E5CF7; --warning:#FFC658; --info:#0EA5E8; --success:#21CE9E; --danger:#FB4242;
  --pink:#FF5D9F; --orange:#FF8E6F;
  --primary005:rgba(92,103,247,.05); --primary01:rgba(92,103,247,.1); --primary02:rgba(92,103,247,.2);

  --body-bg:#F9FAFC; --card-border:#ecf3fb; --input-border:#dee7f1;
  --fg-1:#212b37; --fg-2:#4d5875; --fg-3:#6e829f; --fg-menu:#61748f;
  --gray-1:#f9fafb; --gray-2:#f2f4f5; --gray-3:#e6eaeb; --gray-4:#dbdfe1; --gray-5:#949eb7;

  --menu-bg:#202947; --menu-fg:#a3aed1; --menu-active:#D4B64D;

  --font-sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-base:.8125rem; --fs-xs:.625rem; --fs-sm:.75rem; --fs-md:.875rem; --fs-lg:.95rem;
  --radius-sm:.25rem; --radius-lg:8px; --radius-pill:50px;
  --shadow-card:0px 6px 16px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);

  --rail-w:80px; --rail-w-open:240px; --top-h:68px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.5;color:var(--fg-1);background:var(--body-bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2}
p{margin:0 0 .75rem}
a{color:var(--primary);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;stroke-width:1.9}
.ico-sm{width:14px;height:14px;flex:none;stroke-width:2}
.ico-xs{width:12px;height:12px;flex:none;stroke-width:2.2}
.muted{color:var(--fg-3)} .strong{font-weight:600} .nowrap{white-space:nowrap} .mono{font-variant-numeric:tabular-nums}
.small{font-size:var(--fs-sm)} .xs{font-size:11px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.mt0{margin-top:0}.mb0{margin-bottom:0}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* ---------- SIDEBAR (.rail) — dark menu, fixed, overlay ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);background:var(--menu-bg);color:var(--menu-fg);
  z-index:60;display:flex;flex-direction:column;transition:width .2s ease;overflow:hidden}
.rail.expanded{width:var(--rail-w-open);box-shadow:4px 0 18px rgba(0,0,0,.18)}
.rail-brand{height:3.85rem;flex:none;display:flex;align-items:center;justify-content:center;padding:0 .5rem;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.08)}
.rail-brand .logo{width:34px;height:34px;display:grid;place-items:center;flex:none}
.rail-brand .logo img{width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1)}
.rail.expanded .rail-brand{justify-content:flex-start;padding:0 1.25rem}
.rail-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 30px;scrollbar-width:none}
.rail-nav::-webkit-scrollbar{display:none}
.rail-cat{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6b77a0;padding:14px 12px 6px;white-space:nowrap;
  height:0;padding-top:0;padding-bottom:0;overflow:hidden;opacity:0}
.rail.expanded .rail-cat{height:auto;padding:14px 12px 6px;opacity:1}
.rail-sec{margin-bottom:2px}
.rail-head{width:100%;display:flex;align-items:center;justify-content:center;gap:0;padding:11px 0;border-radius:6px;
  color:var(--menu-fg);background:transparent!important;white-space:nowrap;transition:color .15s}
.rail.expanded .rail-head{justify-content:flex-start;gap:12px;padding:11px 12px}
.rail-head .lbl,.rail-head .chev{width:0;opacity:0;overflow:hidden;transition:opacity .15s}
.rail.expanded .rail-head .lbl{width:auto;opacity:1;flex:1;text-align:left;font-size:var(--fs-base)}
.rail.expanded .rail-head .chev{width:14px;opacity:1}
.rail-head .chev{transition:transform .18s,opacity .15s}
.rail-sec.open .rail-head .chev{transform:rotate(90deg)}
.rail-head:hover,.rail-sec.act>.rail-head{color:var(--menu-active)}
.rail-sub{display:none;list-style:none;margin:0;padding:2px 0 8px 42px}
.rail.expanded .rail-sec.open .rail-sub{display:block}
.rail-sub button{display:block;width:100%;text-align:left;padding:7px 8px;font-size:var(--fs-base);color:var(--menu-fg);
  white-space:nowrap;position:relative;background:transparent!important}
.rail-sub button::before{content:"–";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  font-size:.85rem;color:rgba(255,255,255,.35);transition:color .2s}
.rail-sub button:hover::before,.rail-sub button.on::before{color:var(--menu-active)}
.rail-sub button:hover,.rail-sub button.on{color:var(--menu-active)}
.rail-sub button.on::before{background:currentColor;opacity:1}

/* ---------- MAIN / TOPBAR ---------- */
.main{margin-left:var(--rail-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .2s}
body.nav-open .main{margin-left:var(--rail-w-open)}
.topbar{height:var(--top-h);position:sticky;top:0;z-index:40;background:#fff;box-shadow:0 0 16px 0 rgba(0,0,0,.05);
  display:flex;align-items:center;gap:12px;padding:0 22px}
.hamb{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--radius-lg);color:var(--fg-menu)}
.hamb:hover{background:var(--gray-2)}
.top-mod{font-size:var(--fs-md);font-weight:600;color:var(--fg-1)}
.top-mod small{display:block;font-size:11px;font-weight:400;color:var(--fg-3)}
.role-switch{display:flex;align-items:center;gap:8px;background:var(--gray-1);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:4px 6px 4px 12px}
.role-switch label{font-size:11px;color:var(--fg-3);white-space:nowrap}
.role-switch select{border:0;background:#fff;border-radius:6px;padding:6px 26px 6px 10px;font-size:var(--fs-sm);font-weight:600;color:var(--primary);
  appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C67F7' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 7px center;background-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--fg-menu);position:relative}
.iconbtn:hover{background:var(--gray-2)}
.iconbtn .cnt{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);
  color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.who .nm{font-size:var(--fs-base);font-weight:600;line-height:1.2}
.who .rl{font-size:11px;color:var(--fg-3)}
.scroll{flex:1;padding:22px 24px 44px;min-width:0}

/* ---------- PAGE HEAD ---------- */
.crumb{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);color:var(--fg-3);margin-bottom:4px;flex-wrap:wrap}
.crumb a{color:var(--primary);font-weight:500;cursor:pointer}
.crumb b{color:var(--fg-1);font-weight:500}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:1.2rem;font-weight:600}
.pagehead .sub{font-size:var(--fs-sm);color:var(--fg-3);margin-top:4px}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.3rem .75rem;border-radius:.25rem;
  font-size:.85rem;font-weight:500;line-height:1.2;border:1px solid transparent;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;min-height:32px}
.btn-sm{padding:.2rem .7rem;font-size:.8rem;line-height:1.2;min-height:27px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#4f5ae6}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{background:#1cb98d}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-warning:hover{background:#f2b845}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#ea3535}
.btn-info{background:var(--info);color:#fff;border-color:var(--info)}
.btn-info:hover{background:#0b93cf}
.btn-secondary{background:var(--secondary);color:#fff;border-color:var(--secondary)}
.btn-secondary:hover{background:#8f4cea}
.btn-light{background:#F9F9FA;color:var(--fg-1);border-color:#F9F9FA}
.btn-light:hover{background:#F2F2F3;border-color:#F2F2F3}
.btn-outline{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-outline-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-outline-danger:hover{background:var(--danger);color:#fff}
.btn-outline-success{background:transparent;color:#0E8A66;border-color:var(--success)}
.btn-outline-success:hover{background:var(--success);color:#fff}
.btn-ghost{background:var(--primary01);color:var(--primary)}
.btn-ghost:hover{background:var(--primary);color:#fff}

/* ---------- BADGES ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:var(--radius-pill);white-space:nowrap;line-height:1.35}
.badge svg{width:11px;height:11px;stroke-width:2.4;flex:none}
.b-success{background:rgba(33,206,158,.15);color:#0E8A66}
.b-warning{background:rgba(255,198,88,.22);color:#9a7200}
.b-danger{background:rgba(251,66,66,.12);color:#D93030}
.b-primary{background:rgba(92,103,247,.12);color:var(--primary)}
.b-info{background:rgba(14,165,232,.13);color:#0B85BC}
.b-secondary{background:rgba(158,92,247,.13);color:#7A3FC4}
.b-orange{background:rgba(255,142,111,.2);color:#C4552F}
.b-pink{background:rgba(255,93,159,.14);color:#D23A7B}
.b-muted{background:var(--gray-2);color:var(--fg-2)}
.b-solid-danger{background:var(--danger);color:#fff}
.dotchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:500;padding:4px 12px;border-radius:var(--radius-pill);white-space:nowrap}
.dotchip i{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.rchip{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:4px;color:#fff;min-width:38px}
.r-BSU{background:#21a366}.r-MGU{background:#F59E0B}.r-HOL{background:#e3c300;color:#3d3500}.r-HOR{background:#E0762F}
.r-FRA{background:#0EA5E8}.r-ADM{background:#3cc9d8}.r-CRL{background:#7B3FB5}.r-TCM{background:#E040C8}
.r-Analis{background:#5C67F7}.r-Panelis{background:#949eb7}.r-SYS{background:#4d5875}

/* ---------- CARD (no border, floating shadow) ---------- */
.card{background:#fff;border:0;border-radius:8px;box-shadow:var(--shadow-card);margin-bottom:1rem;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:1rem 1rem .5rem 1rem;border-bottom:0}
.card-head.div{border-bottom:1px solid var(--card-border);padding-bottom:.75rem}
.card-title{font-size:.95rem;font-weight:500;display:flex;align-items:center;gap:8px}
.card-title.sm{font-size:.8125rem;font-weight:500}
.card-sub{font-size:11px;color:var(--fg-3);font-weight:400;margin-top:2px}
.card-body{padding:1rem}
.card-body.flush{padding:0}
.card-body.pt0{padding-top:.25rem}
.card-foot{padding:.75rem 1rem;border-top:1px solid var(--card-border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

/* ---------- GRIDS ---------- */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}
.g-aside{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1rem;align-items:start}
.g-aside>aside{position:sticky;top:calc(var(--top-h) + 16px)}
.g-60{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start}

/* ---------- FORM ---------- */
.form-grid{display:grid;gap:14px 16px}
.form-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{min-width:0}
.field.span2{grid-column:span 2}
.field.span3{grid-column:span 3}
.field.full{grid-column:1/-1}
.label{display:flex;align-items:center;gap:6px;font-size:var(--fs-base);font-weight:500;margin-bottom:6px;flex-wrap:wrap}
.label .req{color:var(--danger)}
.input,.select,.textarea{width:100%;background:#fff;border:1px solid var(--input-border);border-radius:.35rem;padding:.45rem .75rem;
  font-size:var(--fs-base);color:var(--fg-1);outline:none;line-height:1.5;min-height:34px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary01)}
.input::placeholder,.textarea::placeholder{color:var(--gray-5)}
.input[readonly],.input:disabled,.select:disabled{background:var(--gray-2);color:var(--fg-2)}
.textarea{min-height:76px;resize:vertical}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e829f' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:14px;padding-right:30px}
.input-sm{min-height:28px;padding:.25rem .55rem;font-size:var(--fs-sm)}
.hint{font-size:11px;color:var(--fg-3);margin-top:5px}
.unit{display:flex}
.unit .input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0}
.unit span{display:grid;place-items:center;padding:0 10px;font-size:11px;color:var(--fg-2);background:var(--gray-2);border:1px solid var(--input-border);
  border-left:0;border-radius:0 .35rem .35rem 0;white-space:nowrap}
.seg-toggle{display:inline-flex;background:var(--gray-2);border-radius:.35rem;padding:3px;gap:2px}
.seg-toggle button{padding:.3rem .8rem;border-radius:.25rem;font-size:var(--fs-sm);font-weight:500;color:var(--fg-2)}
.seg-toggle button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-base)}
.chk input{width:15px;height:15px;accent-color:var(--primary);margin:0}
.sec-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--card-border)}

/* multi-select (searchable) */
.ms{position:relative}
.ms-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:36px;padding:4px 8px;border:1px solid var(--input-border);border-radius:.35rem;background:#fff;cursor:text}
.ms-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary01)}
.ms-box input{border:0;outline:none;flex:1;min-width:140px;font-size:var(--fs-base);padding:3px}
.ms-chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary01);color:var(--primary);font-size:11px;font-weight:500;padding:2px 4px 2px 9px;border-radius:4px}
.ms-chip button{width:16px;height:16px;display:grid;place-items:center;border-radius:3px;color:var(--primary)}
.ms-chip button:hover{background:var(--primary);color:#fff}
.ms-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border-radius:8px;box-shadow:var(--shadow-md);max-height:280px;overflow:auto;z-index:30;padding:6px;display:none}
.ms.open .ms-list{display:block}
.ms-opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:var(--fs-base)}
.ms-opt:hover{background:var(--gray-1)}
.ms-opt .mt{margin-left:auto;font-size:10px;color:var(--fg-3)}
.ms-grp{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:8px 10px 4px}

/* ---------- ATTACHMENT BLOCK (dz) ---------- */
.attach{margin-bottom:6px}
.attach-sub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 .6rem;border-bottom:1px solid var(--card-border);margin-bottom:.75rem}
.attach-sub-title{display:flex;align-items:center;gap:7px;font-weight:600;font-size:var(--fs-base)}
.attach-sub-title svg{width:14px;height:14px;color:var(--fg-3)}
.attach-row{display:flex;align-items:center;gap:12px;margin-bottom:.75rem}
.attach-ico{width:38px;height:38px;border-radius:8px;background:var(--primary01);color:var(--primary);display:grid;place-items:center;flex:none}
.attach-meta{flex:1;min-width:0}
.attach-name{font-weight:500;font-size:var(--fs-base)}
.attach-sub{font-size:11px;color:var(--fg-3)}
.attach-side{display:flex;align-items:center;gap:10px;flex:none}
.attach-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.attach-badge.req{background:rgba(255,198,88,.22);color:#9a7200}
.attach-badge.opt{background:var(--gray-2);color:var(--fg-2)}
.attach-upload{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--primary);font-weight:500;cursor:pointer}
.attach-upload svg{width:13px;height:13px}
.dropzone{border:1.5px dashed #CBD5E5;border-radius:8px;background:#FCFDFF;padding:20px 16px;text-align:center;color:var(--fg-3);cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--primary);background:var(--primary005)}
.dropzone svg{width:28px;height:28px;color:var(--gray-5);stroke-width:1.6}
.dropzone .dz-t{font-size:var(--fs-base);color:var(--fg-2);margin:6px 0 3px}
.dropzone .dz-browse{color:var(--primary);font-weight:600}
.dropzone .hint{margin-top:2px}
.doc-list{margin-top:10px}
.doc-row{display:flex;align-items:center;gap:11px;padding:9px 0}
.doc-row+.doc-row{border-top:1px solid var(--card-border)}
.doc-ico{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.doc-meta{flex:1;min-width:0}
.doc-meta .dn{font-size:var(--fs-base);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta .du{font-size:10px;color:var(--fg-3);display:block}
.doc-rm{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;background:rgba(251,66,66,.1);color:var(--danger)}
.doc-dl{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;background:rgba(33,206,158,.12);color:#0E8A66}

/* ---------- TABLE ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{font-size:var(--fs-base)}
.tbl th{background:var(--gray-1);padding:.6rem .85rem;text-align:left;font-weight:600;font-size:.75rem;color:var(--fg-1);border-bottom:1px solid var(--card-border);white-space:nowrap}
.tbl td{padding:.65rem .85rem;border-bottom:1px solid var(--card-border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--gray-1)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .ctr{text-align:center}
.tbl .w1{width:1%;white-space:nowrap}
.tbl tr.dim td{opacity:.55}
.tbl tr.sel{background:var(--primary005)}
.tbl-sm td{padding:.45rem .7rem}
.th-sort-ic{width:11px;height:11px;margin-left:4px;vertical-align:-1px;color:var(--gray-5);stroke-width:2.2}
.tbl-link{color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
.tbl-link:hover{color:#4049d8}
.act-ico{width:28px;height:28px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;vertical-align:middle}
.act-ico svg{width:14px;height:14px;stroke-width:2.1}
.act-ico+.act-ico{margin-left:4px}
.act-ico.edit{background:var(--primary)} .act-ico.view{background:var(--info)} .act-ico.ok{background:var(--success)}
.act-ico.del{background:var(--danger)} .act-ico.warn{background:var(--warning)} .act-ico.print{background:var(--secondary)}
.act-ico.lock{background:var(--gray-3);color:var(--fg-3);cursor:not-allowed}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 1rem 1rem}
.filterbar .input,.filterbar .select{width:auto;min-width:150px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray-5)}
.search .input{padding-left:32px;min-width:240px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:.75rem 1rem;border-top:1px solid var(--card-border);font-size:var(--fs-sm);color:var(--fg-3)}
.pager .pg{display:flex;gap:4px}
.pager .pg button{min-width:28px;height:28px;border-radius:4px;color:var(--fg-2);font-size:var(--fs-sm)}
.pager .pg button.on{background:var(--primary);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:0 1rem .9rem}
.pill{padding:.3rem .8rem;border-radius:var(--radius-pill);font-size:var(--fs-sm);font-weight:500;color:var(--fg-2);background:var(--gray-1);border:1px solid var(--card-border)}
.pill .n{margin-left:5px;font-size:10px;background:#fff;border-radius:8px;padding:0 6px;color:var(--fg-3)}
.pill.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill.on .n{background:rgba(255,255,255,.25);color:#fff}

/* ---------- DOC INFOBAR ---------- */
.doc-infobar{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);padding:.75rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.doc-infobar-l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.doc-infobar-item{display:flex;flex-direction:column;line-height:1.3}
.doc-infobar-item .lbl{font-size:.625rem;text-transform:uppercase;letter-spacing:.05em;font-weight:500;color:var(--fg-3)}
.doc-infobar-item .val{font-size:.8125rem;font-weight:500;color:var(--fg-1);white-space:nowrap}
.doc-infobar-sep{color:var(--gray-4)}

/* ---------- TABS (merged tab + content card) ---------- */
.pd-tabcard{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);margin-bottom:1rem}
.tabs-seg{display:flex;gap:4px;border-bottom:1px solid var(--card-border);padding:0 1rem;overflow-x:auto;background:transparent}
.tabs-seg .tab{display:flex;align-items:center;gap:8px;padding:.85rem .75rem;font-size:var(--fs-base);font-weight:500;color:var(--fg-2);white-space:nowrap;position:relative}
.tabs-seg .tab .tc{width:26px;height:26px;border-radius:50%;border:1px solid var(--gray-4);display:grid;place-items:center;color:var(--fg-3);flex:none}
.tabs-seg .tab .tc svg{width:13px;height:13px}
.tabs-seg .tab .n{font-size:10px;background:var(--gray-2);border-radius:8px;padding:0 6px;color:var(--fg-3)}
.tabs-seg .tab:hover{color:var(--primary)}
.tabs-seg .tab.on{color:var(--primary);font-weight:600}
.tabs-seg .tab.on .tc{background:var(--primary);border-color:var(--primary);color:#fff}
.tabs-seg .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}
.tabpane{display:none;padding:1rem}
.tabpane.on{display:block}
.tabpane .card{box-shadow:none;border:1px solid var(--card-border)}

/* ---------- STEPPER (route / pipeline) ---------- */
.pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 4px}
.pstep{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;min-width:96px}
.pstep .bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--gray-3);background:#fff;color:var(--gray-5);display:grid;place-items:center;
  font-weight:600;font-size:12px;position:relative;z-index:2}
.pstep .bub svg{width:15px;height:15px;stroke-width:2.4}
.pstep .cap{font-size:11px;font-weight:500;color:var(--gray-5);text-align:center;line-height:1.3;padding:0 4px}
.pstep .rl{margin-top:-2px}
.pstep::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--gray-3);z-index:1}
.pstep:first-child::before{display:none}
.pstep.done .bub{border-color:var(--success);color:var(--success)}
.pstep.done::before,.pstep.now::before{background:var(--success)}
.pstep.done .cap{color:var(--fg-2)}
.pstep.now .bub{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--primary01)}
.pstep.now .cap{color:var(--primary);font-weight:600}
.pstep.ret .bub{border-color:var(--danger);background:var(--danger);color:#fff;box-shadow:0 0 0 5px rgba(251,66,66,.12)}
.pstep.ret .cap{color:var(--danger);font-weight:600}
.pstep.appr .bub{border-style:dashed}
.pstep.done.appr .bub,.pstep.now.appr .bub{border-style:solid}
.pipe-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--card-border);font-size:var(--fs-base);color:var(--fg-2)}

/* vertical route (form preview) */
.vroute{list-style:none;margin:0;padding:0}
.vroute li{display:flex;gap:10px;padding:0 0 14px;position:relative}
.vroute li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--gray-3)}
.vroute li:last-child::before{display:none}
.vroute .vd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;background:var(--gray-4)}
.vroute li.ap .vd{background:var(--primary)}
.vroute li.pr .vd{background:#fff;border:2px solid var(--gray-4);color:var(--fg-3)}
.vroute .vt{font-size:var(--fs-base);font-weight:500;line-height:1.3}
.vroute .vs{font-size:11px;color:var(--fg-3)}
.vroute li.new{animation:flash 1s ease}
@keyframes flash{0%{background:rgba(255,198,88,.35)}100%{background:transparent}}

/* ---------- KPI / BAR ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1rem}
.kpi{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);padding:1rem;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.kpi:hover{box-shadow:var(--shadow-md)}
.kpi .k-ico{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;flex:none}
.kpi .k-lab{font-size:11px;color:var(--fg-3);font-weight:500}
.kpi .k-val{font-size:1.45rem;font-weight:600;line-height:1.2;margin-top:2px}
.kpi .k-sub{font-size:11px;color:var(--fg-3)}
.t-primary{background:rgba(92,103,247,.12);color:var(--primary)} .t-success{background:rgba(33,206,158,.14);color:#0E8A66}
.t-warning{background:rgba(255,198,88,.22);color:#9a7200} .t-danger{background:rgba(251,66,66,.12);color:var(--danger)}
.t-info{background:rgba(14,165,232,.13);color:#0B85BC} .t-secondary{background:rgba(158,92,247,.13);color:#7A3FC4}
.hbar{display:flex;flex-direction:column;gap:12px}
.hbar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:10px;align-items:center}
.hbar-lab{font-size:var(--fs-base);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{display:flex;height:10px;border-radius:6px;background:var(--gray-2);overflow:hidden}
.hbar-track i{display:block;height:100%}
.hbar-val{text-align:right;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--fg-3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- LANE / TIMELINE / KV ---------- */
.lane{list-style:none;margin:0;padding:0}
.lane li{display:flex;gap:12px;padding:11px 0;align-items:flex-start}
.lane li+li{border-top:1px solid var(--card-border)}
.lane .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:var(--gray-4)}
.lane li.ok .dot{background:var(--success)} .lane li.wait .dot{background:var(--warning);box-shadow:0 0 0 4px rgba(255,198,88,.2)}
.lane li.no .dot{background:var(--danger)}
.lane .lw{flex:1;min-width:0}
.lane .lw .nm{display:block;font-weight:600;font-size:var(--fs-base)}
.lane .lw .ds{display:block;font-size:11px;color:var(--fg-3);margin-top:1px}
.lane .lw .rs{display:block;font-size:11px;margin-top:4px;background:rgba(251,66,66,.07);border-left:2px solid var(--danger);padding:5px 8px;color:#9E2626;border-radius:0 4px 4px 0}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--card-border)}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li::before{content:"";position:absolute;left:-25px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl li.ok::before{border-color:var(--success)} .tl li.no::before{border-color:var(--danger)}
.tl li:last-child{padding-bottom:0}
.tl .tt{font-size:var(--fs-base);font-weight:600}
.tl .td{font-size:11px;color:var(--fg-3);margin-top:1px}
.tl .tr{font-size:11px;margin-top:4px;color:#9E2626}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.kv.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv .k{font-size:11px;color:var(--fg-3);margin-bottom:2px}
.kv .v{font-weight:500;word-break:break-word}
.kv .full{grid-column:1/-1}

/* ---------- NOTE ---------- */
.note{background:var(--primary005);border:1px solid var(--primary02);border-radius:8px;padding:.7rem .9rem;font-size:var(--fs-base);color:var(--fg-2);
  display:flex;gap:10px;margin-bottom:1rem;align-items:flex-start}
.note svg{color:var(--primary);flex:none;margin-top:1px}
.note b{color:var(--fg-1)}
.note.warn{background:rgba(255,198,88,.1);border-color:rgba(255,198,88,.45)} .note.warn svg{color:#9a7200}
.note.danger{background:rgba(251,66,66,.06);border-color:rgba(251,66,66,.3)} .note.danger svg{color:var(--danger)}
.note.ok{background:rgba(33,206,158,.07);border-color:rgba(33,206,158,.35)} .note.ok svg{color:#0E8A66}
.src-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--fg-3);background:var(--gray-2);padding:1px 7px;border-radius:4px}
.empty{padding:34px 16px;text-align:center;color:var(--fg-3)}
.empty svg{width:34px;height:34px;color:var(--gray-4);margin-bottom:6px}

/* ---------- ACTION BAR ---------- */
.actionbar{position:sticky;bottom:0;z-index:20;background:#fff;border-radius:8px;box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:10px 14px;
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;margin-top:4px}

/* ---------- JENIS PICKER ---------- */
.jenis-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-bottom:1rem}
.jp{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);padding:.9rem 1rem;display:flex;gap:12px;align-items:center;text-align:left;border:2px solid transparent}
.jp:hover{border-color:var(--primary02)}
.jp.on{border-color:var(--primary);background:var(--primary005)}
.jp .ji{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.jp b{display:block;font-size:var(--fs-md);font-weight:600}
.jp small{display:block;font-size:11px;color:var(--fg-3);line-height:1.35}

/* ---------- ANALISA GRID (Excel-like) ---------- */
.xgrid{font-size:12px;min-width:1250px}
.xgrid th{background:#f3f5fa;font-size:11px;font-weight:600;text-align:center;padding:.5rem .4rem;border:1px solid var(--card-border);white-space:normal;line-height:1.25;color:var(--fg-2)}
.xgrid td{border:1px solid var(--card-border);padding:0;text-align:right;font-variant-numeric:tabular-nums;height:32px}
.xgrid td .cell{display:block;width:100%;height:100%;padding:6px 7px;outline:none;min-width:58px}
.xgrid td.ed{background:#fff}
.xgrid td.ed .cell:focus{background:var(--primary005);box-shadow:inset 0 0 0 2px var(--primary)}
.xgrid td.calc{background:#fafbfd;color:var(--fg-2)}
.xgrid td.calc.fin{color:var(--danger);font-weight:600}
.xgrid td.avg{color:#7030a0;font-weight:700;text-align:center;vertical-align:middle}
.xgrid td.txt{text-align:center;padding:0 6px}
.xgrid td.code{text-align:center;font-weight:600}
.xgrid tr.pair td{border-top:2px solid #dfe5ef}
.ok-t{color:#0E8A66;font-weight:600} .bad-t{color:var(--danger);font-weight:600}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:5px;background:var(--gray-2);color:var(--fg-2)}
.pchip.done{background:rgba(33,206,158,.16);color:#0E8A66}

/* ---------- LABEL ---------- */
.label-sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lbl-card{border:1px dashed #b9c3d6;border-radius:6px;padding:10px 12px;background:#fff;display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;font-size:11px}
.lbl-card .qr{width:78px;height:78px}
.lbl-card .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.lbl-card .lid{font-size:13px;font-weight:700;letter-spacing:.02em}
.lbl-card .ln{font-weight:600;font-size:12px;line-height:1.25;margin-bottom:3px}
.lbl-card .lm{color:var(--fg-2);line-height:1.45}
.lbl-card .lp{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.lbl-card .lp span{background:var(--gray-2);border-radius:3px;padding:0 5px;font-size:10px}

/* ---------- SENSORY PANEL ---------- */
.panel-sheet{background:#fff;border-radius:8px;box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:1rem}
.ps-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--card-border);background:linear-gradient(90deg,rgba(92,103,247,.05),transparent)}
.ps-head .brand{display:flex;align-items:center;gap:10px}
.ps-head .brand .lg{width:38px;height:38px;border-radius:8px;background:#1f2a6b;color:#D4B64D;display:grid;place-items:center;font-weight:800;font-size:12px}
.ps-head .fr{text-align:right;font-size:11px;color:var(--fg-3);line-height:1.4}
.ps-head .fr b{display:block;color:var(--fg-1);font-size:var(--fs-md)}
.ps-body{display:grid;grid-template-columns:220px minmax(0,1fr)}
.ps-code{padding:18px;text-align:center;border-right:1px solid var(--card-border)}
.ps-code .cd{font-size:3.2rem;font-weight:700;line-height:1;letter-spacing:.04em;color:var(--fg-1)}
.ps-code .sn{font-size:var(--fs-base);font-weight:500;color:var(--fg-2);margin-top:6px}
.ps-code .pg{font-size:11px;color:var(--fg-3);margin-top:14px}
.hed{width:100%}
.hed th{font-size:11px;font-weight:600;color:var(--fg-2);text-align:center;padding:10px 4px;line-height:1.25;border-bottom:1px solid var(--card-border)}
.hed th:first-child{text-align:left;padding-left:18px;width:30%}
.hed td{text-align:center;padding:9px 4px;border-bottom:1px solid var(--card-border)}
.hed td:first-child{text-align:left;padding-left:18px;font-weight:600;font-size:var(--fs-md)}
.hed tr.sep td{background:var(--gray-1);font-size:11px;font-weight:600;color:var(--fg-3);padding:6px 18px}
.rad{width:26px;height:26px;border-radius:50%;border:2px solid var(--gray-4);display:inline-grid;place-items:center;cursor:pointer;transition:all .12s;background:#fff}
.rad:hover{border-color:var(--primary)}
.rad.on{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px #fff}
.rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:18px}
.rank-card{border:1px solid var(--card-border);border-radius:8px;padding:14px;text-align:center}
.rank-card .cd{font-size:2rem;font-weight:700}
.rank-card.pick{border-color:var(--primary);background:var(--primary005)}
.code3{display:inline-block;font-weight:700;font-size:11px;background:#fff4e5;color:#b45309;border:1px solid #fcd9a8;border-radius:4px;padding:0 6px;margin:1px 2px 1px 0;font-variant-numeric:tabular-nums}

/* ---------- COA PREVIEW ---------- */
.coa{background:#fff;border:1px solid var(--card-border);border-radius:6px;padding:26px 28px;position:relative;overflow:hidden;font-size:12px}
.coa .ch{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1f2a6b;padding-bottom:10px;margin-bottom:12px}
.coa .ch .lg{display:flex;align-items:center;gap:10px}
.coa .ch .lg .mk{width:44px;height:44px;border-radius:8px;background:#1f2a6b;color:#D4B64D;display:grid;place-items:center;font-weight:800}
.coa .ch .lg b{display:block;font-size:14px;color:#1f2a6b}
.coa .ch .lg small{color:var(--fg-3);font-size:10px;letter-spacing:.06em}
.coa h3{text-align:center;font-size:14px;letter-spacing:.04em;margin:6px 0 2px}
.coa .cno{text-align:center;color:var(--fg-3);font-size:11px;margin-bottom:12px}
.coa table.ci td{padding:3px 6px;font-size:11.5px;vertical-align:top}
.coa table.ci td:first-child{width:130px;color:var(--fg-3)}
.coa table.cr{margin-top:12px}
.coa table.cr th{background:#1f2a6b;color:#fff;font-weight:500;font-size:11px;padding:6px 8px;text-align:left}
.coa table.cr td{border-bottom:1px solid var(--card-border);padding:6px 8px;font-size:11.5px}
.coa .sig{display:flex;justify-content:space-between;margin-top:22px;gap:14px}
.coa .sig>div{flex:1;text-align:center;font-size:11px}
.coa .sig .box{height:66px;display:grid;place-items:center}
.coa .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:4.2rem;font-weight:800;color:rgba(251,66,66,.13);transform:rotate(-24deg);letter-spacing:.08em}
.coa .wm.draft{color:rgba(92,103,247,.10)}
.kan{display:inline-block;font-size:9px;font-weight:700;background:#1f2a6b;color:#fff;border-radius:3px;padding:0 4px;margin-left:4px}

/* ---------- MATRIX / MISC ---------- */
.mx td.ctr,.mx th.ctr{text-align:center}
.mxc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font-size:11px;font-weight:700}
.mxc.k{background:rgba(33,206,158,.16);color:#0E8A66} .mxc.t{background:rgba(255,198,88,.25);color:#9a7200} .mxc.n{background:var(--gray-2);color:var(--gray-5)}
.chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chain .ar{color:var(--gray-5)}
.bar-mini{display:inline-block;width:70px;height:6px;border-radius:4px;background:var(--gray-2);overflow:hidden;vertical-align:middle;margin-right:6px}
.bar-mini i{display:block;height:100%}
.stat-list{list-style:none;margin:0;padding:0}
.stat-list li{display:flex;align-items:center;gap:10px;padding:9px 0}
.stat-list li+li{border-top:1px solid var(--card-border)}
.stat-list .sl{flex:1;min-width:0}
.stat-list .sl b{display:block;font-weight:500}
.stat-list .sl small{color:var(--fg-3);font-size:11px}
.rev-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--gray-2);color:var(--fg-2)}

/* ---------- MODAL / TOAST ---------- */
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(16,27,61,.45);display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:8px;box-shadow:var(--shadow-md);width:100%;max-width:560px}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1rem;border-bottom:1px solid var(--card-border)}
.modal-head h3{font-size:.95rem;font-weight:500}
.modal-body{padding:1rem}
.modal-foot{padding:.75rem 1rem;border-top:1px solid var(--card-border);display:flex;justify-content:flex-end;gap:8px}
.modal-x{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:var(--fg-3)}
.modal-x:hover{background:var(--gray-2)}
.toast{position:fixed;right:22px;bottom:22px;z-index:220;background:#202947;color:#fff;padding:11px 16px;border-radius:8px;box-shadow:var(--shadow-md);
  font-size:var(--fs-base);max-width:420px;display:none;align-items:center;gap:9px}
.toast.on{display:flex}
.toast svg{color:#21CE9E}

/* ---------- PRINT ---------- */
@media print{
  .rail,.topbar,.pagehead .acts,.actionbar,.no-print,.crumb{display:none!important}
  .main{margin:0!important} .scroll{padding:0}
  body.print-label .card:not(.print-area){display:none!important}
  body.print-label .doc-infobar{display:none!important}
  .card{box-shadow:none}
}

@media (max-width:1200px){
  .g-aside{grid-template-columns:minmax(0,1fr)} .g-aside>aside{position:static}
  .form-grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .jenis-pick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .g2,.g3,.g-60{grid-template-columns:minmax(0,1fr)}
  .form-grid.c2,.form-grid.c3,.form-grid.c4{grid-template-columns:minmax(0,1fr)}
  .field.span2,.field.span3{grid-column:auto}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ps-body{grid-template-columns:minmax(0,1fr)} .ps-code{border-right:0;border-bottom:1px solid var(--card-border)}
  .scroll{padding:16px 16px 36px}
  .who .nm,.who .rl,.top-mod small{display:none}
}
@media (max-width:640px){
  .rail{width:0} .rail.expanded{width:var(--rail-w-open)}
  .main,body.nav-open .main{margin-left:0}
  .jenis-pick{grid-template-columns:minmax(0,1fr)}
  .role-switch label{display:none}
  .search .input{min-width:0;width:100%}
}

 const s=[];
 if(o.tipe==='Urgent') s.push(A('Approve MGU','MGU'),A('Approve HOL','HOL'),A('Approve HOR','HOR'));
 if(o.tujuan==='MD'||o.tujuan==='P5') s.push(A('Approve FRA','FRA'));

 return `${String(dt.getDate()).padStart(2,'0')}-${String(dt.getMonth()+1).padStart(2,'0')}-${dt.getFullYear()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`}

function seedHist(r){
 if(r.hist.length)return;
 const p=pipeline(r), pos=posOf(r);
 if(r.state==='draft'){r.hist.push({t:'Draft disimpan',by:r.pemohon,role:'BSU',at:r.tgl+' 09:10',k:'info'});return}
 const upto=r.state==='ret'?p.findIndex(s=>s.n===r.retBy.at):pos;
 for(let i=0;i<upto;i++){const s=p[i];
  const by=i===0?r.pemohon:actor(s.role,r.id+s.n);
  r.hist.push({t:i===0?'Pengajuan disubmit':(s.k==='appr'?s.n+' — disetujui':s.n+' — selesai'),by,role:s.role,at:addHours(r.tgl,i),k:'ok'});}
 if(r.state==='ret')r.hist.push({t:r.retBy.at+' — dikembalikan ke BSU',by:r.retBy.who,role:r.retBy.role,at:r.retBy.tgl,k:'no',reason:r.retBy.reason});
}

function qrSvg(seed,size=78){ // QR tiruan, deterministik
 let h=0;for(const c of seed)h=(h*131+c.charCodeAt(0))>>>0;const n=21,cell=size/n;let r='';
 const fin=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="#111"/><rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${3*cell}" height="${3*cell}" fill="#111"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;h=(h*1103515245+12345)>>>0;if(h&0x40000)r+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#111"/>`}
 return `<svg class="qr" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><rect width="${size}" height="${size}" fill="#fff"/>${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`;
}

function recalc(){
 const tb=$('#xgrid tbody');if(!tb)return;const isKA=CUR.arg.endsWith('~KA');const trs=$$('tr',tb);const pct=[];
 trs.forEach((tr,i)=>{const d=num($('[data-f="d"]',tr).textContent),s=num($('[data-f="s"]',tr).textContent);
  const ws=$$('[data-f="w"]',tr).map(c=>num(c.textContent)).filter(v=>v!=null);const fin=ws.length?ws[ws.length-1]:null;
  $('[data-o="fin"]',tr).textContent=fmt(fin);let v=null;if(d!=null&&s&&fin!=null)v=isKA?(d+s-fin)/s*100:(fin-d)/s*100;pct[i]=v;$('[data-o="pct"]',tr).textContent=v==null?'':fmt(v,2)});
 let allOk=true;
 trs.forEach((tr,i)=>{if(i%2)return;const a=pct[i],b=pct[i+1];const avg=(a!=null&&b!=null)?(a+b)/2:null;const rpd=avg?Math.abs(a-b)/avg*100:null;
  $('[data-o="avg"]',tr).textContent=avg==null?'':fmt(avg,2);$('[data-o="rpd"]',tr).innerHTML=rpd==null?'':fmt(rpd,2)+'%';
  $('[data-o="inf"]',tr).innerHTML=rpd==null?'':(rpd<10?'<span class="ok-t">teliti</span>':'<span class="bad-t">ulang</span>');if(rpd==null||rpd>=10)allOk=false});
 const f=$('#specFlag');if(f)f.innerHTML=allOk?badge('Presisi OK — semua duplo RPD < 10%','b-success','check'):badge('Ada duplo belum lengkap / perlu diulang','b-warning','alert');
}

 go('analisa');}

 if(d.pnlMode){PNL.mode=d.pnlMode;rerender();return}
 if(d.pnlIdx){PNL.idx=Math.max(0,Math.min(1,PNL.idx+ +d.pnlIdx));rerender();return}
 if(d.rad){const [c,a,i]=d.rad.split('|');PNL.ans[c+a]=+i;$$(`[data-rad^="${c}|${a}|"]`).forEach(x=>x.classList.toggle('on',x===t));return}
 if(d.tri){PNL.tri=d.tri;rerender();return}
 if(d.pnlSubmit!==undefined){toast('Jawaban panelis tersimpan (9/12 panelis sesi 1)');PNL.ans={};PNL.idx=0;PNL.rank={};PNL.tri=null;rerender();return}
 if(d.kan){const [id,v]=d.kan.split('|');KAN[id]=v==='1';rerender();return}
 if(d.backAnalis){const r=reqById(d.backAnalis);r.hist.push({t:'Draf Report — dikembalikan ke Analis',by:me(),role:ROLE,at:TODAY,k:'no',reason:'Perlu cek ulang duplo'});r.step='Push Data';r.pushed=r.pushed.slice(0,-1);toast('Dikembalikan ke analis');rerender();return}
 if(d.backCrl){const r=reqById(d.backCrl);r.hist.push({t:'Final Report — dikembalikan ke CRL',by:me(),role:ROLE,at:TODAY,k:'no',reason:'Perbaiki spesifikasi'});r.step='Draf Report';toast('Dikembalikan ke CRL');rerender();return}
 if(d.publish){const r=reqById(d.publish);advance(r,'Final Report — digital sign-off & publish');r.coa='LHU/TCL/202609/'+String(440+REQUESTS.indexOf(r)).padStart(4,'0');r.pubAt=TODAY;toast(r.coa+' terbit — notifikasi dikirim ke '+r.pemohon);rerender();return}
 if(d.revSubmit!==undefined){const v=$('#revReason').value.trim();if(!v||!$('#revAgree').checked){toast('Alasan & persetujuan wajib diisi');return}const r=REQUESTS.find(isPub);REVS.unshift({id:r.id,from:r.rev||0,to:(r.rev||0)+1,by:me(),tgl:TODAY,alasan:v,st:'pending'});toast('Revisi diajukan — menunggu approval ADM');rerender();return}
 if(d.revOk){const v=REVS[+d.revOk];v.st='approved';v.adm=me();const r=reqById(v.id);r.rev=v.to;toast('Rev-0'+v.to+' terbit · versi lama diberi watermark SUPERSEDED');rerender();return}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(t.id==='f_tipe'){FORM.tipe=t.value;$('#wrapAlasan').hidden=t.value!=='Urgent';refreshForm();$$('#routeBox .vroute li').forEach(li=>li.classList.add('new'));return}
 if(t.id==='f_tujuan'){FORM.tujuan=t.value;refreshForm();$$('#routeBox .vroute li').forEach(li=>li.classList.add('new'));return}
 if(d.param){const c=d.param;t.checked?FORM.params.includes(c)||FORM.params.push(c):FORM.params=FORM.params.filter(x=>x!==c);refreshForm();return}
 if(d.lf){LF[d.lf]=t.value;rerender();return}
 if(d.kjHasil){KJ[d.kjHasil].hasil=t.value;KJ[d.kjHasil].cat=$('#kjCat').value;rerender();return}
 if(d.kj){const [id,c,i]=d.kj.split('|');KJ[id].chk[c][+i]=t.checked?1:0;rerender();return}
 if(d.rank){PNL.rank[d.rank]=t.value;rerender();return}
 if(d.mpLab!==undefined){mpFilter();return}
});
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(t.closest&&t.closest('#xgrid')){recalc();return}
 if(t.id==='paramQ'){const q=t.value.toLowerCase();$('#paramMs').classList.add('open');$$('#paramMs .ms-opt').forEach(o=>o.hidden=q&&!o.dataset.pname.includes(q));return}
 if(d.lfQ!==undefined){LF.q=t.value;const pos=t.selectionStart;rerender();const n=$('[data-lf-q]');n.focus();n.setSelectionRange(pos,pos);return}
 if(d.mpQ!==undefined){mpFilter();return}
 if(d.sidx!==undefined){FORM.samples[+d.sidx].n=t.value;return}
});
document.addEventListener('focusin',e=>{if(e.target.id==='paramQ')$('#paramMs').classList.add('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#paramMs')?.classList.remove('open')}});
function mpFilter(){const q=($('[data-mp-q]')?.value||'').toLowerCase(),l=$('[data-mp-lab]')?.value||'';$$('[data-mp]').forEach(tr=>tr.hidden=(q&&!tr.dataset.mp.includes(q))||(l&&tr.dataset.mpl!==l))}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-label'));
window.addEventListener('hashchange',route);

/* =====================================================================
   24. INIT
   ===================================================================== */
setRole('BSU');
route();
</script>
